<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sports Scoreboard TV - Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Use paths relative to this index.html to work when serving the preview folder directly -->
  <link rel="stylesheet" href="./styles.css">
  <!-- No <base> tag to avoid path resolution issues across hosting setups -->
</head>
<body>
  <header>
    <h1>Sports Scoreboard TV</h1>
    <span class="subtitle">Ocean Professional Theme</span>
  </header>
  <main>
    <section class="matches" id="matches"></section>
    <section class="detail">
      <h2 id="detailTitle">Select a match</h2>
      <div id="detailScore" class="score">-</div>
      <div id="detailStatus" class="status"></div>
      <video id="video" controls width="640" height="360" poster="">
        <source id="videoSource" src="" type="video/mp4">
      </video>
    </section>
  </main>
  <!-- Use relative path so it works if server root != repo root -->
  <script src="./preview.js"></script>
</body>
</html>
